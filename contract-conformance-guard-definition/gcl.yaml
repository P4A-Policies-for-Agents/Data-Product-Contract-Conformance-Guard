---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: Data Product Contract Conformance Guard
    category: Quality of Service
    description: >-
      Derives a data product's field contract from Informatica CDGC (a scanned
      asset's columns — schema, flat file, table, etc. — + linked Business Terms)
      and checks each response against it — log, inform, strip, or reject per drift type.
    metadata/capabilities/injectionPoint: inbound
    metadata/capabilities/assetTypes: mcp,rest,http
    metadata/interfaceScope: api,resource
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    cdgcLoginUrl:
      type: string
      format: service
      description: IDMC login base URL, e.g. https://dm-us.informaticacloud.com.
    cdgcSearchUrl:
      type: string
      format: service
      description: >-
        CDGC search API base (the cdgc-api host serving ccgf-searchv2), e.g.
        https://cdgc-api.dm-us.informaticacloud.com.
    cdgcOrgUsername:
      type: string
      description: IDMC read-only service-account username.
      "@context": { "@characteristics": [security:sensitive] }
    cdgcOrgPassword:
      type: string
      description: IDMC service-account password.
      "@context": { "@characteristics": [security:sensitive] }
    schemaId:
      type: string
      description: >-
        CDGC asset id of the scanned schema — a flat file, table, etc. — whose
        governed columns define the contract. The policy enumerates its columns
        and their linked Business Terms from CDGC — no per-field configuration.
    schemaIdHeader:
      type: string
      default: x-dp-schema-id
      description: Optional request header overriding schemaId per request (multi-product).
    schemaIdClaim:
      type: string
      description: >-
        Optional JWT claim name to read schemaId from. When set and present in the
        caller's (upstream-validated) Bearer token, the claim wins over schemaIdHeader
        — so the token binds the caller to a data product and a spoofed header can't
        redirect it. Unset (default) = header/config only. Requires a JWT Validation
        policy upstream to verify the token.
    recordsPath:
      type: string
      default: ""
      description: >-
        "/"-separated path into the tool-result payload to the record(s) whose
        fields are checked, e.g. "products". Empty = payload root; array = each element.
    sensitiveLevels:
      type: string
      default: confidential,restricted
      description: >-
        Comma-separated IDMC Business Term "Security Level" (securityClassification)
        values that mark a field sensitive — e.g. confidential,restricted. Matched
        case-insensitively against each column's linked term's structured
        classification. This is the primary sensitivity signal.
    sensitiveMarker:
      type: string
      default: confidential
      description: >-
        Fallback only, used when a term has no Security Level set: case-insensitive
        substring in the term's description that marks the field sensitive (e.g. a
        term whose definition says "Confidential: ...").
    onUnexpectedField:
      type: string
      enum: [off, log, inform, strip, reject]
      default: strip
      description: A response field not present in the governed column set.
    onMissingRequired:
      type: string
      enum: [off, log, inform, strip, reject]
      default: reject
      description: A required (isCDE) governed field absent from the response record.
    onTypeMismatch:
      type: string
      enum: [off, log, inform, strip, reject]
      default: inform
      description: A response field whose JSON type differs from the governed column datatype.
    onSensitiveField:
      type: string
      enum: [off, log, inform, strip, reject]
      default: strip
      description: A sensitive governed field appearing in the response (leak guard).
    refreshIntervalSeconds:
      type: integer
      default: 86400
      minimum: 30
      description: Cache TTL for the derived contract before a lazy CDGC refresh.
    failOpenOnCdgcError:
      type: boolean
      default: true
      description: >-
        On a transient CDGC error with a cached contract, keep enforcing it. With
        no contract at all, pass the response through (never block on own outage).
    distributed:
      type: boolean
      default: false
      description: Share cached contract + refresh lock across replicas (needs shared storage).
    timeout:
      type: integer
      default: 5000
      description: Per-call CDGC timeout (ms), clamped to a chained refresh budget (~15s).
  required:
    - cdgcLoginUrl
    - cdgcSearchUrl
    - cdgcOrgUsername
    - cdgcOrgPassword
    - schemaId
